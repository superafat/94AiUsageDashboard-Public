name: Manual CI (Owner approval required)

# Zero-cost GitHub rule: never auto-run this workflow.
# A manual run is allowed only after explicit Owner approval for that exact use.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:public-ready
      - run: npm run verify:public-release -- --skip-public-ready
        env:
          PUBLIC_RELEASE_HEAD_SHA: ${{ github.sha }}
